<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CFBElite app icon</title>
  <desc id="desc">A garnet and brass program crest with a CE monogram, on a graphite ground.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171c28"/><stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c22c47"/><stop offset=".55" stop-color="#a6233d"/><stop offset="1" stop-color="#7d1b2f"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e8c979"/><stop offset=".5" stop-color="#c79a3e"/><stop offset="1" stop-color="#a67c2c"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="20" y="20" width="984" height="984" rx="204" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="8"/>

  <g filter="url(#shadow)">
    <path d="M512 128 L782 214 L782 486 C782 664 668 782 512 862 C356 782 242 664 242 486 L242 214 Z"
      fill="url(#shield)" stroke="url(#brass)" stroke-width="16"/>
    <rect x="288" y="470" width="448" height="34" fill="url(#brass)"/>
    <rect x="288" y="470" width="448" height="10" fill="#fff" opacity=".35"/>
  </g>

  <g font-family="Barlow Condensed, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#f6ece0">
    <text x="512" y="410" font-size="220" letter-spacing="-2">CE</text>
  </g>
  <g font-family="Barlow Condensed, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#f2e2bd" letter-spacing="18">
    <text x="512" y="640" font-size="46">ELITE NETWORK</text>
  </g>
</svg>
