<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CFB Elite 27 app icon</title>
  <desc id="desc">A navy broadcast shield with a gold E, blue 27 and red game stripe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07152b"/><stop offset=".55" stop-color="#020617"/><stop offset="1" stop-color="#17070b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554"/><stop offset=".48" stop-color="#0f172a"/><stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff3a3"/><stop offset=".35" stop-color="#facc15"/><stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#93c5fd"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <path d="M-60 760 1084 250v176L-60 936z" fill="#7f1d1d" opacity=".45"/>
  <path d="M-60 708 1084 198v78L-60 786z" fill="#dc2626"/>
  <path d="M-60 786 1084 276v25L-60 811z" fill="#f87171" opacity=".72"/>
  <g filter="url(#shadow)">
    <path d="M512 118 821 231v262c0 201-120 340-309 421C323 833 203 694 203 493V231z" fill="#030712" stroke="#f8fafc" stroke-width="30"/>
    <path d="M512 143 792 245v248c0 181-104 307-280 386-176-79-280-205-280-386V245z" fill="url(#shield)" stroke="#facc15" stroke-width="15"/>
    <path d="M262 286h500" stroke="#dc2626" stroke-width="28"/>
    <path d="M281 323h462" stroke="#f8fafc" stroke-width="8" opacity=".75"/>
  </g>
  <g fill="#f8fafc" font-family="DejaVu Sans,Arial,sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="258" font-size="68" letter-spacing="15">CFB</text>
  </g>
  <g filter="url(#glow)" font-family="DejaVu Sans,Arial,sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="500" y="620" font-size="390" fill="url(#gold)" stroke="#020617" stroke-width="22" paint-order="stroke">E</text>
  </g>
  <g font-family="DejaVu Sans,Arial,sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="548" y="815" font-size="230" fill="url(#blue)" stroke="#f8fafc" stroke-width="14" paint-order="stroke">27</text>
  </g>
  <rect x="24" y="24" width="976" height="976" rx="200" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="10"/>
</svg>
