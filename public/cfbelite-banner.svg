<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="t d">
  <title id="t">CFBElite</title>
  <desc id="d">Elite Network CFBElite dynasty hub banner</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c28"/>
      <stop offset=".55" stop-color="#0e121a"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="20%" r="60%">
      <stop offset="0" stop-color="#a6233d" stop-opacity=".28"/>
      <stop offset="1" stop-color="#a6233d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="85%" r="55%">
      <stop offset="0" stop-color="#c79a3e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c79a3e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#ground)"/>
  <rect width="1600" height="420" fill="url(#glow1)"/>
  <rect width="1600" height="420" fill="url(#glow2)"/>

  <g opacity=".07" stroke="#ffffff" stroke-width="2">
    <line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
  </g>

  <image href="/app-icon-512.png" x="110" y="110" width="200" height="200"/>

  <g transform="translate(350,150)">
    <text font-family="Barlow Condensed, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="1" fill="#eef1f6">CFB<tspan fill="#c79a3e">ELITE</tspan></text>
    <text y="46" font-family="Barlow Condensed, Arial, sans-serif" font-weight="600" font-size="26" letter-spacing="6" fill="#8b93a5">ELITE NETWORK &#8226; ONLINE DYNASTY</text>
  </g>

  <rect x="1" y="1" width="1598" height="418" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
