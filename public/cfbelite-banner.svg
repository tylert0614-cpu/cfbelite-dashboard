<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="t d">
  <title id="t">CFBElite</title>
  <desc id="d">Elite Network CFBElite dynasty hub banner</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c28"/>
      <stop offset=".55" stop-color="#0e121a"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="glow1" cx="14%" cy="30%" r="55%">
      <stop offset="0" stop-color="#3e7fc1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3e7fc1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#ground)"/>
  <rect width="1600" height="420" fill="url(#glow1)"/>

  <g opacity=".05" stroke="#ffffff" stroke-width="2">
    <line x1="0" y1="90" x2="1600" y2="90"/>
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="270" x2="1600" y2="270"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
  </g>

  <image href="/logo-floating-480.png" x="96" y="90" width="240" height="240"/>

  <g transform="translate(380,195)">
    <text font-family="Inter, Arial, sans-serif" font-weight="700" font-size="80" letter-spacing="-1" fill="#eef1f6">CFBElite</text>
    <text y="42" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="17" letter-spacing="3" fill="#8b93a5">ELITE NETWORK</text>
  </g>

  <rect x="1" y="1" width="1598" height="418" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
</svg>
